[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-pef"
version = "0.1.1"
description = "Payment Evidence Frame (PEF) v1 -- AlgoVoi's canonical wrapper for payment-lifecycle receipts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "rfc8785>=0.1.4",
]
keywords = [
    "x402", "payment", "receipt", "canonicalization", "jcs", "pef",
    "trust", "evidence", "agentic-payments",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://docs.algovoi.co.uk"
Repository = "https://github.com/chopmob-cloud/algovoi-pef"
Documentation = "https://docs.algovoi.co.uk/pef"

[tool.hatch.build.targets.wheel]
packages = ["algovoi_pef"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that require a live api.algovoi.co.uk connection (deselect with -m 'not live')",
]
